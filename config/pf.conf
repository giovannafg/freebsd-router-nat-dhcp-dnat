# /etc/pf.conf - roteador NAT + DNAT (FreeBSD PF)
# Validar sintaxe: pfctl -nf /etc/pf.conf

# Interfaces do perfil QEMU; conferir no equipamento físico.
ext_if = "em0"
int_if = "em1"
lan_net = "172.16.0.0/16"
dnat_host = "172.16.0.10"

set skip on lo0

# NAT: LAN -> IP dinâmico da WAN.
nat on $ext_if inet from $lan_net to any -> ($ext_if)

# Marca somente conexões recebidas no IP WAN:80 e traduzidas para a LAN.
rdr on $ext_if inet proto tcp from any to ($ext_if) port 80 tag DNAT_WEB -> $dnat_host port 8080

# Bloqueio padrão (também IPv6); respostas de conexões aceitas usam estado.
block log all

# DHCP da WAN: inclui oferta/ACK broadcast, além das renovações unicast.
pass out quick on $ext_if inet proto udp from any port 68 to any port 67 keep state
pass in quick on $ext_if inet proto udp from any port 67 to { ($ext_if), 255.255.255.255 } port 68 keep state

# DHCP da LAN: o cliente ainda sem IP envia de 0.0.0.0:68.
pass in quick on $int_if inet proto udp from any port 68 to { ($int_if), 255.255.255.255 } port 67 keep state
pass out quick on $int_if inet proto udp from ($int_if) port 67 to { $lan_net, 255.255.255.255 } port 68 keep state

# A LAN inicia conexões e acessa o roteador; a WAN só devolve respostas,
# oferece DHCP e atende o DNAT descrito acima. Não há SSH novo pela WAN.
pass in on $int_if inet from $lan_net to any keep state
pass out on $ext_if inet from ($ext_if) to any keep state

# A marca evita liberar acesso WAN direto ao IP privado na porta 8080.
pass in on $ext_if inet proto tcp to $dnat_host port 8080 tagged DNAT_WEB keep state
pass out on $int_if inet proto tcp to $dnat_host port 8080 tagged DNAT_WEB keep state
