# /etc/pf.conf - roteador NAT + DNAT
# Validar sintaxe: pfctl -nf /etc/pf.conf

ext_if = "em0"
int_if = "em1"
lan_net = "172.16.0.0/16"
dnat_host = "172.16.0.10"

set skip on lo0

# NAT: LAN -> IP da WAN
nat on $ext_if inet from $lan_net to any -> ($ext_if)

# DNAT: porta 80 da WAN -> porta 8080 da máquina de testes
rdr on $ext_if inet proto tcp from any to ($ext_if) port 80 -> $dnat_host port 8080

# Filtragem: TODO restringir (por enquanto libera tudo)
pass all
