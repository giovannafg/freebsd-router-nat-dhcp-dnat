# /usr/local/etc/dhcpd.conf
# Validar sintaxe: dhcpd -t -cf /usr/local/etc/dhcpd.conf

option domain-name-servers 164.41.101.4, 164.41.101.11;
default-lease-time 600;
max-lease-time 7200;
authoritative;
log-facility local7;

subnet 172.16.0.0 netmask 255.255.0.0 {
  range 172.16.1.100 172.16.1.200;
  option routers 172.16.0.1;
  option subnet-mask 255.255.0.0;
  option broadcast-address 172.16.255.255;
}

# Máquina de testes: sempre recebe o mesmo IP (também é o alvo do DNAT)
host maquina-teste {
  hardware ethernet 52:54:00:16:00:10;  # MAC do cliente QEMU; substituir no laboratório
  fixed-address 172.16.0.10;
}
