# Referência do que scripts/instalar.sh grava em /etc/rc.conf (via sysrc).
# Os nomes reais das interfaces vêm de config/router.conf; em0 (WAN) e
# em1 (LAN) são do perfil QEMU.
hostname="roteador"

# WAN: IP da rede de acesso (DHCP; ou "inet ... netmask ..." + defaultrouter)
ifconfig_em0="DHCP"
# LAN: rede privada /16
ifconfig_em1="inet 172.16.0.1 netmask 255.255.0.0"

# Encaminhamento de pacotes entre interfaces
gateway_enable="YES"

# Packet Filter (NAT + DNAT + bloqueio de ping) e log dos bloqueios (pflog0)
pf_enable="YES"
pf_rules="/etc/pf.conf"
pflog_enable="YES"

# Servidor DHCP somente na LAN
dhcpd_enable="YES"
dhcpd_ifaces="em1"

# Lembrete dos papéis, usado por scripts/diagnostico.sh
roteador_wan_if="em0"
roteador_lan_if="em1"
