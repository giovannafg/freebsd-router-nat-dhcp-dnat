# Trechos a acrescentar em /etc/rc.conf do roteador
hostname="roteador"

# Perfil simulado QEMU: em0 WAN, em1 LAN (conferir no equipamento físico)
# WAN: DHCP em 192.168.50.0/24, gateway simulado 192.168.50.1
ifconfig_em0="DHCP"
# LAN: rede privada /16
ifconfig_em1="inet 172.16.0.1 netmask 255.255.0.0"

# Encaminhamento de pacotes entre interfaces
gateway_enable="YES"

# Packet Filter (NAT + DNAT)
pf_enable="YES"
pf_rules="/etc/pf.conf"

# Servidor DHCP somente na LAN
dhcpd_enable="YES"
dhcpd_ifaces="em1"
